name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    env:
      ORIWARD_DB: ${{ github.workspace }}/outputs/ci-state/oriward.sqlite3
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Byte-compile (syntax check)
        run: python -m compileall -q oriward scripts

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke (isolated database, no network)
        env:
          ORIWARD_DB: ${{ runner.temp }}/smoke/oriward.sqlite3
        run: |
          python -m oriward init
          python -m oriward twin status
          python -m oriward context brief --max-chars 1200
          python -m oriward jobs import --csv data/examples/jobs.csv
          python -m oriward jobs card --id 1

      - name: Optional extension stays off by default
        shell: python
        env:
          ORIWARD_ENABLE_LIEPIN: "0"
        run: |
          import json, subprocess, sys
          result = subprocess.run(
              [sys.executable, "-m", "oriward", "jobs", "search", "--provider", "liepin", "--query", "test"],
              check=True, capture_output=True, text=True, encoding="utf-8",
          )
          data = json.loads(result.stdout)
          assert data["status"] == "EXTENSION_DISABLED", data
          assert data["executed"] is False, data
          print("ok: extension disabled by default")

      - name: Fictional end-to-end workflow (no network)
        run: python scripts/demo_hiring_loop.py --output outputs/ci-hiring-loop-demo

      - name: Fictional decision lifecycle (no network)
        run: python scripts/demo_twin_lifecycle.py --output outputs/ci-twin-demo

      - name: Optional document export dependencies
        if: matrix.python-version == '3.13'
        run: python -m pip install -e ".[documents]"

      - name: Document export behavior
        if: matrix.python-version == '3.13'
        run: |
          python -m unittest discover -s tests -p test_document_export.py -v
          python -m unittest discover -s tests -p test_resume_templates.py -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build and check distribution metadata
        run: |
          python -m pip install build twine ruff
          python -m ruff check oriward scripts tests .agents/skills/document-export/scripts
          python -m build
          python -m twine check dist/*
      - name: Verify source distribution includes Agent workflows
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          import tarfile
          with tarfile.open(next(Path("dist").glob("*.tar.gz"))) as archive:
              names = [PurePosixPath(member.name) for member in archive.getmembers() if member.isfile()]
          files = {str(PurePosixPath(*path.parts[1:])) for path in names}
          skills = {name for name in files if name.startswith(".agents/skills/") and name.endswith("/SKILL.md")}
          assert len(skills) == 9, skills
          assert {"AGENTS.md", "docs/WORKFLOWS.md", "scripts/doctor.py", "tests/test_skill_manifest.py"} <= files
          assert {
              "docs/assets/oriward-architecture.png",
              "docs/assets/oriward-cover.png",
              "docs/assets/oriward-poster.png",
              "scripts/render_readme_assets.py",
          } <= files
          for template in ("modern-cn", "clean"):
              assert {f"docs/assets/resume-templates/{template}/sample.{ext}" for ext in ("docx", "pdf")} <= files
              assert f"docs/assets/resume-templates/{template}/preview.png" in files
          assert not any(".." in path.parts or path.is_absolute() for path in names)
          assert not any(name.startswith(("data/private/", "outputs/", ".workbuddy/")) for name in files)
          print("ok: source workflows present; private state excluded")
      - name: Install wheel outside source tree
        working-directory: ${{ runner.temp }}
        env:
          ORIWARD_DB: ${{ runner.temp }}/wheel-smoke/oriward.sqlite3
        run: |
          python -m pip install "${{ github.workspace }}"/dist/*.whl
          python -c "import oriward, pathlib; module = pathlib.Path(oriward.__file__).resolve(); checkout = pathlib.Path(r'${{ github.workspace }}').resolve(); assert checkout not in module.parents, module; print(f'installed package: {module}')"
          oriward init
          oriward onboarding missing
