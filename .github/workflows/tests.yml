name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Byte-compile (syntax check)
        run: python -m compileall -q careeros scripts

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke (isolated database, no network)
        env:
          CAREEROS_DB: ${{ runner.temp }}/smoke/careeros.sqlite3
        run: |
          python -m careeros init
          python -m careeros twin status
          python -m careeros context brief --max-chars 1200
          python -m careeros jobs import --csv data/examples/jobs.csv
          python -m careeros jobs card --id 1

      - name: Optional extension stays off by default
        shell: python
        env:
          CAREEROS_ENABLE_LIEPIN: "0"
        run: |
          import json, subprocess, sys
          result = subprocess.run(
              [sys.executable, "-m", "careeros", "jobs", "search", "--provider", "liepin", "--query", "test"],
              check=True, capture_output=True, text=True, encoding="utf-8",
          )
          data = json.loads(result.stdout)
          assert data["status"] == "EXTENSION_DISABLED", data
          assert data["executed"] is False, data
          print("ok: extension disabled by default")

      - name: Fictional end-to-end workflow (no network)
        run: python scripts/demo_hiring_loop.py --output outputs/ci-hiring-loop-demo

      - name: Optional document export dependencies
        if: matrix.python-version == '3.13'
        run: python -m pip install -e ".[documents]"

      - name: Document export behavior
        if: matrix.python-version == '3.13'
        run: python -m unittest discover -s tests -p test_document_export.py -v
