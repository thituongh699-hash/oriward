name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Byte-compile (syntax check)
        run: python -m compileall -q careeros scripts

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: CLI smoke (isolated database, no network)
        env:
          CAREEROS_DB: ${{ runner.temp }}/smoke/careeros.sqlite3
        run: |
          python -m careeros init
          python -m careeros twin status
          python -m careeros context brief --max-chars 1200
          python -m careeros jobs import --csv data/examples/jobs.csv
          python -m careeros jobs card --id 1

      - name: Optional extension stays off by default
        run: |
          python -m careeros jobs search --provider liepin --query test | tee /tmp/out.json
          python - <<'PY'
          import json, pathlib
          data = json.loads(pathlib.Path("/tmp/out.json").read_text(encoding="utf-8"))
          assert data["status"] == "EXTENSION_DISABLED", data
          assert data["executed"] is False, data
          print("ok: extension disabled by default")
          PY
