[project]
name = "oriward-local"
version = "0.3.0"
description = "Evidence-backed career growth workbench for students and recent graduates, powered by your chosen agent"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oriward contributors" }]
keywords = ["career", "job-search", "resume", "students", "graduates", "local-first", "sqlite", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business",
]
# No third-party runtime dependencies: the CLI is standard library only.
dependencies = []

# Repository URLs. Update the account/organisation if the remote differs.
[project.urls]
Homepage = "https://github.com/thituongh699-hash/oriward"
Repository = "https://github.com/thituongh699-hash/oriward"
Issues = "https://github.com/thituongh699-hash/oriward/issues"
Changelog = "https://github.com/thituongh699-hash/oriward/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["ruff>=0.6"]
documents = ["python-docx>=1.2,<2", "reportlab>=4.4,<6", "pypdf>=5,<7"]

[project.scripts]
oriward = "oriward.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oriward*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Start with real-bug rules only; widening the rule set is a separate, reviewable change.
select = ["E9", "F"]
